<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bubble Studio — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #12203a, #070b14 70%);
        color: #e6f0ff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.4rem; letter-spacing: 0.02em; }
      p { color: #93a4bd; max-width: 34ch; line-height: 1.6; }
      button {
        margin-top: 18px;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid #22d3ee55;
        background: #0f1b2e;
        color: #d6f7ff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .bubble {
        width: 72px; height: 72px; border-radius: 50%;
        margin: 0 auto 18px;
        background: radial-gradient(circle at 35% 30%, #bff4ff, #22d3ee 45%, #1a237e 100%);
        box-shadow: 0 0 40px #22d3ee44;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="bubble"></div>
      <h1>Bubble Studio está offline</h1>
      <p>A interface foi guardada neste dispositivo, mas esta tela ainda não está em cache. Reconecte para abrir o Studio.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
